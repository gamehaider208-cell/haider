          } : null

      });

      grow += 300 + Math.floor(F(growIndex++ % 97) * 900);

      return {

        nowUser: { name: 'علي — كاشير', uname: 'cashier' }, paused: false,

        devices, open: devices.filter(d => d.on).map(d => Object.assign({ dev: d.name, zoneName: d.zoneName }, d.sess)),
        today: mkStat(dayTotal, 0), week: mkStat(Math.round(dayTotal * 5.6), 1), month: mkStat(Math.round(dayTotal * 21), 2),
        daily: daily(dayTotal), zones: zones.map(z => ({ id: z.id, name: z.name, cls: z.cls, total: devices.filter(d => d.zone === z.id).length, on: devices.filter(d => d.zone === z.id && d.on).length })),
        closings: closings(dayTotal),
        log: [{ ts: now() - 60000, kind: 'login', by: 'cashier', msg: 'دخول للنظام', who: 'علي — كاشير' },
        { ts: now() - 20000, kind: 'open', by: 'cashier', msg: 'فتح جلسة: PS-01 — أبو علي', who: 'علي — كاشير' }],
        staff: [{ uname: 'admin', name: 'المدير', role: 'admin', perms: ['*'], active: true, lastLogin: now() - 3600000 }],
        watchers: [{ id: 'u1', uname: 'admin', name: 'المدير', role: 'admin', perms: ['*'], active: true, salt: 's', rounds: 2, hash: derive('demo1234', 's', 2), mustChange: false }],

    }
    function mkStat(t, k) {
      const j = i => F(i + (k || 0) * 13.7);
      return {
        total: t, time: Math.round(t * .62), cafe: t - Math.round(t * .62), refund: Math.round(t * .02 * (0.5 + j(1))), discount: Math.round(t * .03 * (0.5 + j(2))),
        sessions: Math.max(3, Math.round(t / 5200)), invoices: Math.max(2, Math.round(t / 2600)), minutes: Math.round(t / 65), refundsCount: Math.round(j(3) * 3),

        cats: { 'مشروبات': Math.round(t * .2), 'أراكيل': Math.round(t * .12), 'طعام': Math.round(t * .06) },
        hourly: (() => { const a = new Array(24).fill(0); const hh = new Date().getHours(); for (let h = 9; h <= hh; h++) a[h] = Math.round(t * (0.03 + 0.05 * F(h))); return a; })(),

  /* ---- 3) فايربيز: Realtime Database عبر REST ---- */
  T.firebase = function (cfg) {
    const base = (cfg.firebase.databaseURL || '').replace(/\/+$/, '');
    let tok = null, tokTo = 0;
    const err = m => { const e = new Error(m); e.cloud = true; return e; };
    if (!base || !cfg.firebase.apiKey) throw err('ضع رابط قاعدة البيانات ومفتاح API في هذا الملف');
    const path = p => base + '/enterzone/' + encodeURIComponent(CFG.branch) + p + '.json';
    async function req(method, p, body) {
      const res = await fetch(path(p), {
        method, headers: { 'Content-Type': 'application/json' },
        body: body === undefined ? undefined : JSON.stringify(body)
      }
      );
      if (res.status === 401 || res.status === 403) {
        const msg = (await res.text().catch(() => '')).slice(0, 90);
        throw err(/Permission denied/.test(msg) ? 'قواعد Firebase تمنع الاتصال المباشر. طبّق ملف firebase-rules.json مرة واحدة.' : ('مرفوض من فايربيز: ' + (msg || res.status)));
      }
      if (!res.ok) throw err('استجابة غير متوقعة (' + res.status + ')');
      const txt = await res.text();
      try { return txt === 'null' ? null : JSON.parse(txt); } catch (e) { return null; }
    }
    const subs = new Set(); let loop = null;
    async function poll() { try { const s = await req('GET', '/state'); if (s) subs.forEach(f => f(s)); } catch (e) { lastErr = e.message; } }
    let lastErr = '';
    return {
      name: 'firebase',
      info: () => 'اتصال مباشر بقاعدة البيانات',
      error: () => lastErr,
      pushState: s => req('PUT', '/state', s),
      getState: () => req('GET', '/state'),
      putCmd: c => req('PUT', '/cmd/' + c.id, c),
      getCmds: () => req('GET', '/cmd').then(o => o ? Object.keys(o).map(k => o[k]) : []),
      ackCmd: id => req('DELETE', '/cmd/' + id),
      subscribe: fn => {
        subs.add(fn);
        if (!loop) { poll(); loop = setInterval(poll, Math.max(1, CFG.pollSec) * 1000); }
        return () => { subs.delete(fn); if (!subs.size && loop) { clearInterval(loop); loop = null; } };
      }
    };
  };

  /* ---- 4) فايربيز Firestore (REST) — نفس المسارات: enterzone/<branch>/state + cmd/<id> ---- */
  T.firestore = function (cfg) {

      '/databases/' + encodeURIComponent(db) + '/documents';

      if (AUTH.sess) return await AUTH.token();
      throw new Error('لازم تسجّل الدخول بحساب فايربيز أولًا');
    }
    const url = (p, q) => api + p + (p.indexOf('?') >= 0 ? '&' : '?') + 'key=' + encodeURIComponent(cfg.firebase.apiKey) + (q || '');
    /* تحويل JSON ←→ بنية Firestore */
    function val(v) {
      if (v === null || v === undefined) return { nullValue: null };

      if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };

      return { stringValue: String(v) };
    }
    function unval(v) {

      if ('nullValue' in v) return null;
      if ('booleanValue' in v) return v.booleanValue;
      if ('integerValue' in v) return Number(v.integerValue);
      if ('doubleValue' in v) return Number(v.doubleValue);
      if ('stringValue' in v) return v.stringValue;
      if (v.timestampValue) return Math.round(new Date(v.timestampValue).getTime());

      const t = await tok();

    }
    const subs = new Set(); let loop = null;
    async function poll() {
      try {
        const j = await req('GET', '/' + CFG.branch + '/state');
        const st = j && j.fields ? unval({ mapValue: { fields: j.fields } }).v : null;
        if (st) subs.forEach(fn => fn(st));
      } catch (e) { lastErr = e.message; }
    }
    return {
      name: 'firestore',
      info: () => 'Firestore — ' + f.projectId + ' / enterzone/' + CFG.branch,
      error: () => lastErr,
      pushState: st => req('POST', '/' + CFG.branch + '/state?updateMask.fieldPaths=v', doc({ v: st, ts: (st && st.ts) || now() })),
      getState: async () => { const j = await req('GET', '/' + CFG.branch + '/state'); return j && j.fields ? unval({ mapValue: { fields: j.fields } }).v : null; },
      putCmd: c => req('POST', '/' + CFG.branch + '/cmd/' + encodeURIComponent(c.id) + '?updateMask.fieldPaths=c', doc({ c, ts: now() })),
      getCmds: async () => {
        const j = await req('GET', '/' + CFG.branch + '/cmd?pageSize=30');
        return ((j && j.documents) || []).map(d => unval({ mapValue: { fields: d.fields } }).c).filter(Boolean);
      },
      ackCmd: id => req('DELETE', '/' + CFG.branch + '/cmd/' + encodeURIComponent(id)),
      subscribe: fn => {
        subs.add(fn);
        if (!loop) { poll(); loop = setInterval(poll, Math.max(1, CFG.pollSec) * 1000); }
        return () => { subs.delete(fn); if (!subs.size && loop) { clearInterval(loop); loop = null; } };
      },
      stop() { if (loop) clearInterval(loop); loop = null; subs.clear(); }
    };
  };

  let TX = null, mode = CFG.mode;
  function build() {

    if (m === 'off') { TX = null; ST.on = false; ST.mode = 'off'; ST.error = 'لم يُضبط الاتصال بعد — اختر الوضع من زر «ضبط الاتصال» (التجريبي يعرض بيانات وهمية فورًا)'; return null; }
    try {
      TX = (m === 'firebase' ? T.firebase(CFG) : m === 'firestore' ? T.firestore(CFG) : m === 'demo' ? T.demo() : T.local()) || T.local();
      ST.on = true; ST.error = ''; ST.mode = m; ST.info = TX.info ? TX.info() : m;
    } catch (e) {

    get cfg() { return CFG; },
    get st() { return ST; },
    auth: AUTH, bus,
    isAuthed: () => !!AUTH.sess && AUTH.sess.exp > Date.now(),
    login: (email, pw) => AUTH.signIn(email, pw),
    signOut: () => AUTH.signOut(),
    who: () => AUTH.who(),
    tx: () => TX,
    configure(patch) { CFG = mergeCfg(CFG, patch || {}); build(); return ST; },
    save(cfgObj) { try { localStorage.setItem(LS, JSON.stringify(cfgObj || CFG)); return true; } catch (e) { return false; } },
    reset() { try { localStorage.removeItem(LS); return true; } catch (e) { return false; } },
    setBranch(b) { CFG.branch = b || 'main'; build(); },
    derive, checkPw, sha256,
    transportName: () => (TX && TX.name) || 'off',
    /* قراءة مسار خام داخل فرع الصالة — لتشخيص القواعد */
    async raw(path) {
      const t = this.tx();

      const r = await fetch(base + '/enterzone/' + encodeURIComponent(CFG.branch) + path + '.json?auth=' + encodeURIComponent(tk));
      const txt = await r.text();

    },

    pushState: s => TX ? TX.pushState(s) : Promise.reject(new Error('غير متصل')),
    onCmd: fn => TX && TX.getCmds ? (async () => { const l = await TX.getCmds().catch(() => []); l.forEach(fn); })() : null,

    sendCmd: async c => { if (!TX) throw new Error('غير متصل'); c.ts = now(); await TX.putCmd(c); return c; },

.mhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,rgba(34,230,255,.14),transparent)}
.mhead h3{font-size:17px;font-weight:900;flex:1}
.mhead .x{width:32px;height:32px;border-radius:9px;background:#182433}
.mbody{padding:16px}.mfoot{display:flex;gap:9px;justify-content:flex-end;padding:13px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.fld{margin-bottom:12px}.fld label{display:block;font-size:12px;font-weight:800;color:var(--dim);margin-bottom:6px;letter-spacing:.4px}
.two{display:grid;gap:11px;grid-template-columns:1fr 1fr}
pre.code,textarea.code{direction:ltr;text-align:left;white-space:pre;font-size:11.5px;line-height:1.7;background:#070d18;
  border:1px solid var(--line);border-radius:11px;padding:11px;overflow:auto;width:100%;resize:vertical;
  font-family:ui-monospace,Menlo,Consolas,monospace;color:#bfe6ff}
textarea.code:focus{outline:none;border-color:var(--cyan)}

/* ============ التنبيهات المنبثقة ============ */
.toasts{position:fixed;bottom:14px;inset-inline-start:14px;z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:11px 15px;border-radius:11px;font-weight:800;font-size:13px;background:linear-gradient(180deg,#12203a,#0a1120);
  border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 40px -16px #000;animation:tin .25s}
.toast.ok{border-color:rgba(184,255,53,.4);color:#dcffb0}.toast.err{border-color:rgba(255,77,77,.45);color:#ffc0c0}
.toast.info{border-color:rgba(34,230,255,.4);color:#b6f2ff}
@keyframes tin{from{transform:translateX(-20px);opacity:0}}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:var(--cyan);animation:sp .9s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.pulse{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.5}}
@media (max-width:640px){.rail .ttl small{display:none}main{padding:12px 9px 30px}.kpi b{font-size:22px}}

/* ===== واجهة هاتف مخصصة للوحة المراقبة ===== */
body{background:#050912}
.wrap{width:min(100%,560px);margin:0 auto;background:linear-gradient(180deg,#07101d,#04070d);box-shadow:0 0 80px rgba(0,0,0,.55)}
.rail{padding:10px 12px;min-height:62px}
.rail .logo{width:34px;height:34px}.rail .ttl b{font-size:14px}.rail .ttl small{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{position:fixed;z-index:55;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);height:70px;padding:7px max(8px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);gap:4px;flex-wrap:nowrap;background:rgba(5,9,18,.96);border-top:1px solid rgba(34,230,255,.2);border-bottom:0;backdrop-filter:blur(18px)}
.nav button{min-width:0;padding:9px 3px;border-radius:12px;font-size:10.5px;overflow:hidden;text-overflow:ellipsis}
.nav button.on{background:linear-gradient(145deg,#19dcff,#73a0ff);box-shadow:0 8px 24px -12px #22e6ff}
main{padding:14px 11px calc(90px + env(safe-area-inset-bottom));max-width:560px}
.foot{display:none}.card{padding:14px;border-radius:18px;clip-path:none}.kpi{clip-path:none;border-radius:16px}.g2,.g3,.g4{grid-template-columns:1fr 1fr}.leds{grid-template-columns:1fr 1fr}
.btn{min-height:44px}.scrl{max-height:none}.empty-state{text-align:center;padding:32px 18px}
.boot{padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}.boot-card{width:min(390px,100%);padding:24px 18px}.boot-card img{width:72px;height:72px}.b-ttl{font-size:27px}
@media (max-width:380px){.rail .ttl{display:none}.g2,.g3,.g4,.leds{grid-template-columns:1fr}.nav button{font-size:9.5px}.lamp{padding:6px 9px}}
@media (min-width:561px){body{padding:18px 0}.wrap{min-height:calc(100vh - 36px);border:1px solid rgba(255,255,255,.08);border-radius:26px;overflow:hidden}.nav{bottom:18px;border-radius:0 0 25px 25px}}

</style>
</head>

<script>
/* ═══ مضمّن داخل هذا الملف: monitor.js ═══ */
/* ============================================================
   ENTER ZONE — لوحة المراقبة (monitor.js)
   قراءة فقط: تعرض حالة نظام الكاشير وتستطيع إيقافه/استئنافه بأمر واحد.
   لا تحتوي على أي دالة تعديل — ولا تُرسِل أي تغيير إلى السحابة.
   ============================================================ */
(function (w) {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const money = n => Math.round(Number(n) || 0).toLocaleString('en-US');
  const pad = n => String(n).padStart(2, '0');
  const hhmm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  const hhmmss = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
  const stamp = ts => ts ? (new Date(ts).toLocaleDateString('ar-EG', { day: '2-digit', month: '2-digit' }) + ' ' + hhmm(ts)) : '—';
  const dur = ms => { if (ms < 0) ms = 0; const s = Math.floor(ms / 1000); return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60); };
  const durAr = ms => { const m = Math.floor(Math.max(0, ms) / 60000); return (m >= 60 ? Math.floor(m / 60) + ' س ' : '') + pad(m % 60) + ' د'; };
  const CFGKEY = 'enterzone.panel.cfg.v1', MEKEY = 'enterzone.panel.me.v1', CACHE = 'enterzone.panel.cache.v1';

  /* ============ الحالة ============ */
  const P = {
    cfg: {
      mode: 'local',                     // off | local | demo | firebase | firestore
      loginMode: '',                     // '' = تلقائي: فايربيز للوضع السحابي، وحسابات النظام للمحلي/التجريبي
      branch: 'main', pollSec: 3,
      firebase: { apiKey: '', projectId: '', databaseURL: '', authDomain: '', appId: '' },
      device: { email: '', password: '' },
      allow: []                          // حسابات فايربيز المسموح لها (لو لم تصل قائمة الصندوق)
    },
    tx: null, state: null, user: null, view: 'dash', timer: null, tickT: null, unsub: null,
    loading: false, err: '', lastFetch: 0, tries: 0
  };
  /* إعداد ثابت وآمن: لوحة المشاهدة تتصل بمشروع Firebase المحدد فقط. */
  if (w.EZCloud && w.EZCloud.cfg) {
    const fileCfg = w.EZCloud.cfg;
    P.cfg.mode = 'firebase';
    P.cfg.loginMode = 'direct';
    P.cfg.branch = fileCfg.branch || 'main';
    P.cfg.pollSec = Math.max(2, Number(fileCfg.pollSec) || 3);
    P.cfg.firebase = Object.assign({}, P.cfg.firebase, fileCfg.firebase || {});
    P.cfg.device = { email: '', password: '' };
    P.cfg.allow = Array.isArray(fileCfg.allow) ? fileCfg.allow.slice() : [];
  }
  const clouds = m => m === 'firebase' || m === 'firestore';
  const loginMode = () => P.cfg.loginMode || (clouds(P.cfg.mode) ? 'firebase' : 'program');
  const allowList = () => {
    const st = P.state || {};
    const fromPos = [].concat(st.panelEmails || [], ((st.watchers || []).map(u => (u.femail || '').toLowerCase()).filter(Boolean)));
    const list = fromPos.length ? fromPos : (P.cfg.allow || []).map(x => String(x).toLowerCase());
    return [...new Set(list)];
  };
  const adminList = () => {
    const st = P.state || {};
    const l = (st.panelAdmins && st.panelAdmins.length) ? st.panelAdmins
      : (st.staff || []).filter(u => (u.perms || []).includes('*')).map(u => (u.femail || '')).filter(Boolean);
    return [...new Set(l.map(x => String(x).toLowerCase()))];
  };
  const canControl = () => {
    if (!P.user) return false;
    if (P.user.via === 'direct') return true;
    if (loginMode() !== 'firebase') return !!(P.user.perms && (P.user.perms.includes('*') || P.user.perms.includes('watch')));
    const a = adminList();
    return !a.length ? (allowList().length === 0 || allowList().includes(P.user.email)) : a.includes(P.user.email);
  };
  const cur = () => (P.state && P.state.currency) || 'د.ع';
  const toast = (m, k) => {
    const t = el('div', 'toast ' + (k || 'info'), esc(m));
    $('#toasts').appendChild(t);
    while ($('#toasts').children.length > 3) $('#toasts').removeChild($('#toasts').firstChild);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = '.3s'; }, 2600);
    setTimeout(() => t.remove(), 3000);
  };
  function modal(title, body, buttons) {
    $('#mT').textContent = title; $('#mB').innerHTML = body; $('#mF').innerHTML = '';
    (buttons || [{ label: 'إغلاق', cls: 'btn-p', on: c => c() }]).forEach(b => {
      const n = el('button', 'btn ' + (b.cls || 'btn-o'), b.label);
      n.onclick = () => b.on(close);
      $('#mF').appendChild(n);
    });
    $('#modal').classList.remove('hidden');
  }
  const close = () => $('#modal').classList.add('hidden');
  $('#mX').onclick = close;
  $('#modal').onclick = e => { if (e.target.id === 'modal') close(); };

  /* ============ الاتصال والنقل ============ */
  function applyCfg() {
    if (!w.EZCloud) { P.err = 'ملف ez-cloud.js غير موجود في هذا المجلد'; return null; }
    EZCloud.configure({
      mode: P.cfg.mode, branch: P.cfg.branch, pollSec: P.cfg.pollSec, pushSec: P.cfg.pollSec,
      firebase: P.cfg.firebase, device: P.cfg.device
    });
    const t = EZCloud.tx();
    P.tx = t; P.err = t ? '' : (EZCloud.st.error || 'تعذر تهيئة الاتصال');
    return t;
  }
  function saveCfg() { try { localStorage.setItem(CFGKEY, JSON.stringify(P.cfg)); } catch (e) { } }

  async function fetchState(silent) {
    const t = P.tx || applyCfg();
    if (!t) return null;
    P.loading = true; paintLamp();
    try {
      const s = await t.getState();
      if (s && typeof s === 'object') {
        P.state = s; P.lastFetch = Date.now(); P.err = ''; P.tries = 0;
        try { localStorage.setItem(CACHE, JSON.stringify(s)); } catch (e) { }
        if (!silent) render();
        paintLamp();
      } else if (!P.state) P.err = 'لا توجد بيانات بعد في هذا الفرع';
      return s;
    } catch (e) {
      P.err = e.message || 'انقطاع الاتصال'; P.tries++;
      const cached = localStorage.getItem(CACHE);
      if (cached && !P.state) { try { P.state = JSON.parse(cached); render(); } catch (x) { } }
      paintLamp(); if (!silent) toast('✖ ' + P.err, 'err');
      return null;
    } finally { P.loading = false; paintLamp(); }
  }
  function startLoop() {
    stopLoop();
    const sec = Math.max(2, Number(P.cfg.pollSec) || 3);
    P.timer = setInterval(() => { if (!document.hidden) fetchState(true); }, sec * 1000);
    P.tickT = setInterval(() => { tickTimers(); }, 1000);
    if (P.tx && P.tx.subscribe) { try { P.unsub = P.tx.subscribe(s => { if (s) { P.state = s; P.lastFetch = Date.now(); render(); } }); } catch (e) { } }
  }
  function stopLoop() {
    if (P.timer) clearInterval(P.timer); if (P.tickT) clearInterval(P.tickT);
    P.timer = P.tickT = null;
    if (P.unsub) { try { P.unsub(); } catch (e) { } P.unsub = null; }
  }
  const age = () => (P.state ? Math.max(0, Date.now() - Number(P.state.ts || 0)) : Infinity);
  const fresh = () => age() < 25000;

  /* ============ الدخول ============ */
  const watchers = () => (P.state && P.state.watchers) || [];
  function canWatch(u) { return !!u && u.active !== false && (u.perms || []).some(p => p === '*' || p === 'watch'); }
  /* دخول عبر Firebase Authentication (بريد + كلمة مرور) */
  async function fbLogin(email, pw) {
    const t = applyCfg();
    if (!t) throw new Error(P.err || 'لا يوجد اتصال — اضبط الوضع على firebase في config.js');
    if (!/@/.test(email)) throw new Error('اكتب البريد الإلكتروني كاملًا مثل: watch@enterzone.app');
    await EZCloud.login(email, pw);
    const whoAm = EZCloud.who();
    if (P.cfg.authorizedUid && (!whoAm || whoAm.uid !== P.cfg.authorizedUid)) {
      EZCloud.signOut();
      throw new Error('هذا الحساب غير مصرح له بفتح لوحة المراقبة');
    }
    P.tx = EZCloud.tx();
    let st = null;
    try { st = await P.tx.getState(); } catch (e) { st = null; P.err = e.message; }
    P.state = st || P.state;
    if (st) { P.lastSeen = Date.now(); try { localStorage.setItem(CACHE, JSON.stringify(st)); } catch (e) { } }
    const allow = allowList();
    if (allow.length && !allow.includes(String(whoAm.email).toLowerCase()))
      throw new Error('حساب ' + whoAm.email + ' غير مسموح له بفتح اللوحة — أضِفه من الكاشير: ☁ الاتصال → بريد لوحة المراقبة');
    P.user = {
      email: String(whoAm.email).toLowerCase(), name: (st && st.staff && (st.staff.find(x => (x.femail || '').toLowerCase() === String(whoAm.email).toLowerCase()) || {}).name) || whoAm.email,
      uname: ((st && st.staff && st.staff.find(x => (x.femail || '').toLowerCase() === String(whoAm.email).toLowerCase())) || {}).uname || whoAm.email.split('@')[0],
      role: 'panel', perms: [], ctrl: false, via: 'firebase', at: Date.now()
    };
    P.user.ctrl = canControl();
    P.err = '';
    enter(true);
    return null;
  }
  function restoreSession() {
    if (loginMode() !== 'firebase' || !EZCloud.isAuthed()) return false;
    const whoAm = EZCloud.who();
    if (!whoAm) return false;
    if (P.cfg.authorizedUid && whoAm.uid !== P.cfg.authorizedUid) { EZCloud.signOut(); return false; }
    P.tx = applyCfg();
    if (!P.tx) return false;
    const allow = allowList();
    P.user = { email: String(whoAm.email).toLowerCase(), name: whoAm.email, uname: whoAm.email.split('@')[0], role: 'panel', perms: [], ctrl: true, via: 'firebase', at: Date.now() };
    fetchState(true).then(() => {
      const a2 = allowList();
      if (a2.length && !a2.includes(P.user.email)) { P.user = null; EZCloud.signOut(); toast('هذا الحساب غير مسموح له باللوحة', 'err'); location.reload(); return; }
      P.user.ctrl = canControl();
      enter(false);
    });
    return true;
  }
  async function tryLogin(name, pw) {
    if (loginMode() === 'firebase') return fbLogin(name, pw);
    const t = applyCfg();
    if (!t) return '⚠ ' + P.err;
    const list = watchers();
    if (!list.length) return 'لا توجد حسابات مصرّح لها بهذه اللوحة في هذا الفرع — أضِف صلاحية «لوحة المراقبة» من نظام الكاشير' + (fresh() ? '' : ' أو تحقق من الاتصال');
    const u = list.find(x => String(x.uname).toLowerCase() === String(name).toLowerCase().trim());
    if (!u) {
      const known = ((P.state && P.state.staff) || []).find(x => String(x.uname).toLowerCase() === String(name).toLowerCase().trim());
      if (known) return 'حساب «' + known.name + '» لا يملك صلاحية «لوحة المراقبة» — تُضاف من نظام الكاشير: ⚙ الإعدادات ← ☁ الاتصال أو من المستخدمين';
      return 'اسم المستخدم غير موجود في هذه الصالة';
    }
    if (u.active === false) return 'هذا الحساب موقوف — راجع المدير';
    if (!canWatch(u)) return 'هذا الحساب لا يملك صلاحية «لوحة المراقبة»';
    if (!EZCloud.checkPw(u, pw)) return 'كلمة المرور غير صحيحة';
    P.user = { uname: u.uname, name: u.name, role: u.role, perms: u.perms || [], at: Date.now() };
    localStorage.setItem(MEKEY, JSON.stringify(P.user));
    enter();
    return null;
  }
  function enter(animate) {

    fetchState(false);
    toast('مرحبًا ' + (P.user.name || P.user.email || ''), 'ok');
    if (location.hash === '#pause') setTimeout(() => control('pause'), 600);
    if (location.hash === '#resume') setTimeout(() => control('resume'), 600);
  }
  function signOut() {
    stopLoop(); P.user = null; localStorage.removeItem(MEKEY);

  /* ============ بناء شاشة الدخول ============ */
  function boot() {

    $('#u').placeholder = fb ? 'watch@enterzone.app' : 'admin';
    $('#u').type = fb ? 'email' : 'text';
    $('#u').autocomplete = fb ? 'username' : 'username';
    $('.b-sub').textContent = fb ? 'مراقبة مباشرة وآمنة عبر Firebase' : 'لوحة المراقبة — القراءة الحيّة لصالونك';
    $('#go').textContent = fb ? 'دخول بالبريد' : 'دخول اللوحة';
    /* جلسة فايربيز سارية؟ ادخل مباشرة */
    if (fb && EZCloud.isAuthed()) { if (restoreSession()) return; }
    const T = applyCfg();
    const names = { firebase: 'فايربيز', local: 'مرآة محلية', demo: 'تجريبي', off: 'مطفأة' };
    badge.textContent = 'اتصال مباشر';

    if (!T) {
      conn.textContent = 'تعذر الاتصال';

        msg.id = 'bootConnectError'; $('#boot').appendChild(msg);
      }

      conn.textContent = 'Firebase جاهز';

    }
  }

  /* ============ التبويبات ============ */
  const VIEWS = [
    ['dash', 'الحالة'], ['devs', 'الأجهزة'], ['sales', 'المبيعات'],
    ['rep', 'التقارير'], ['staff', 'الموظفون'], ['ctl', 'التحكم']

  function buildNav() {

      b.dataset.v = v[0];

  /* ============ العرض ============ */
  const stat = (s, k) => (s && s[k]) || 0;
  function render() {
    if (!P.user) return;
    const s = P.state, v = $('#view');
    $('#hallTxt').textContent = (s && s.hall ? s.hall : 'لوحة المراقبة');
    if (!s) {
      v.innerHTML = '<div class="card empty-state"><b style="font-size:17px">بانتظار بيانات النظام</b>' +

  function paintLamp() {
    const n = $('#lamp'), t = $('#lampTxt'); if (!n) return;
    let cls = 'off', txt = 'غير متصل';
    if (P.tx) {
      if (P.state && fresh()) { cls = 'on'; txt = 'مباشر ' + (age() < 10000 ? 'الآن' : Math.round(age() / 1000) + 'ث'); }
      else if (P.state) { cls = 'warn'; txt = 'متأخر ' + Math.round(age() / 1000) + 'ث'; }
      else { cls = 'warn'; txt = 'بانتظار بثّ النظام'; }
      if (P.loading) txt = '…جارٍ التحديث';
      if (P.err && !P.state) { cls = 'off'; txt = P.err.slice(0, 26); }
    } else { cls = 'off'; txt = P.err || 'لا اتصال'; }
    n.className = 'lamp ' + cls; t.textContent = txt;

  function tickTimers() {
    const s = P.state; if (!s) return;
    const n = Date.now();
    $$('[data-end]').forEach(e => {
      const end = Number(e.dataset.end), left = end - n;
      e.textContent = (left >= 0 ? '' : '+') + dur(Math.abs(left));

    $$('[data-since]').forEach(e => { e.textContent = dur(n - Number(e.dataset.since)); });
    $$('[data-cost]').forEach(e => {

      const rate = Number(e.dataset.rate) || 0, since = Number(e.dataset.since) || 0, end = e.dataset.end ? Number(e.dataset.end) : null;
      const stopAt = end ? Math.min(n, end) : n;

    });
  }

          ${devs.length ? `<div class="scrl"><table class="tbl"><thead><tr><th>الجهاز</th><th class="num">وقت اللعب</th></tr></thead>
            <tbody>${devs.map(i => `<tr><td>${esc(i.name)}</td><td class="num">${money(i.rev)} ${cur()}</td></tr>`).join('')}</tbody></table></div>` : '<p class="note">لا بيانات.</p>'}
          <div class="hr"></div><div class="h" style="font-size:13px">طرق الدفع</div>
          ${Object.keys(pay).length ? Object.keys(pay).map(k => `<div class="row" style="justify-content:space-between;font-size:13px;padding:3px 0">
            <span>${esc(k)}</span><b class="mono">${money(pay[k])} ${cur()}</b></div>`).join('') : '<p class="note">لم تُسجَّل دفعات بعد.</p>'}</div>
      </div>
      <div class="card" style="margin-top:12px"><div class="h">توزيع الإيراد بالساعة (اليوم)</div>
        <div class="row" style="gap:4px;align-items:flex-end;height:120px">
          ${(t.hourly || new Array(24).fill(0)).map((x, i) => {
      const mx = Math.max.apply(null, (t.hourly || [1]).concat([1]));
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:14px">
              <div style="width:100%;height:${Math.round((x / mx) * 92)}px;min-height:2px;border-radius:4px 4px 0 0;
                background:linear-gradient(180deg,${x ? 'var(--cyan)' : '#1b2942'},${x ? 'var(--mag)' : '#101a2c'})" title="${i}:00 — ${money(x)}"></div>
              <small style="font-size:8.5px;color:#61748f">${i}</small></div>`;
    }).join('')}</div></div>
      <div class="card" style="margin-top:12px"><div class="h">الفواتير والعمليات الأخيرة</div>${logList((s.log || []).filter(l => l.kind === 'sale' || l.kind === 'close'||l.kind === 'refund').slice(0, 16))}</div>`;
  }

  /* ---------- 4) الجرد والتقارير ---------- */
  function days(s, n) { return (s.daily || []).slice(0, n); }
  function viewReports(v) {
    const s = P.state;
    const ranges = [['today', 'اليوم', s.today], ['week', 'الأسبوع', s.week], ['month', 'الشهر', s.month]];
    const daily = days(s, 60);
    const sum = (arr, k) => arr.reduce((a, x) => a + (Number(x[k]) || 0), 0);
    const last7 = daily.slice(0, 7), last30 = daily.slice(0, 30);
    v.innerHTML = `<div class="grid g3" style="margin-bottom:12px">
      ${ranges.map(r => {
      const st = r[2] || {};
      return `<div class="kpi ${r[0] === 'today' ? 'c' : r[0] === 'week' ? 'g' : 'y'}"><small>${r[1]}</small><b>${money(st.total)}</b>
          <div class="sub">${cur()} • ${st.sessions || 0} جلسة • ${(st.minutes || 0) / 60 | 0} ساعة</div>
          <div class="note" style="margin-top:4px">وقت ${money(st.time)} • كافتيريا ${money(st.cafe)} • خصم ${money(st.discount)} • مرتجع ${money(st.refund)}</div></div>`;
    }).join('')}</div>
      <div class="card" style="margin-bottom:12px"><div class="h">🧮 جرد مبني على سجل الأيام
        <span class="sp"></span><span class="chip">آخر ٧ أيام <b>${money(sum(last7, 'total'))}</b></span>
        <span class="chip g">آخر ٣٠ يومًا <b>${money(sum(last30, 'total'))}</b></span></div>
        <div class="scrl" style="max-height:44vh"><table class="tbl"><thead><tr><th>اليوم</th><th class="num">الإجمالي</th><th class="num">وقت</th><th class="num">كافتيريا</th><th class="num">خصم</th><th class="num">مرتجع</th><th class="num">جلسات</th><th class="num">ساعات</th></tr></thead>
          <tbody>${daily.length ? daily.map(d => `<tr><td class="mono">${esc(d.day)}</td><td class="num">${money(d.total)}</td><td class="num">${money(d.time)}</td>
            <td class="num">${money(d.cafe)}</td><td class="num ${d.discount ? 'neg' : ''}">${money(d.discount)}</td><td class="num">${money(d.refund)}</td>
            <td class="num">${d.sessions || 0}</td><td class="num">${((d.minutes || 0) / 60).toFixed(1)}</td></tr>`).join('')
        : '<tr><td colspan="8" class="note">لا سجلات يومية بعد — ستظهر أول ما يُغلق الصندوق يومه أو تُحدَّث البيانات.</td></tr>'}</tbody></table></div>
        <p class="note" style="margin-top:8px">الأسبوع = ${last7.length} يوم، الشهر = ${last30.length} يوم من السجل المرسل من الصندوق.</p></div>
      <div class="card"><div class="h">🔒 كشوف الجرد المحفوظة (إغلاق اليوم)</div>
        ${(s.closings || []).length ? `<div class="scrl"><table class="tbl"><thead><tr><th>التاريخ</th><th class="num">الصافي</th><th class="num">النقد</th><th class="num">الفرق</th><th>موظف</th><th>ملاحظات</th></tr></thead>
          <tbody>${s.closings.slice(0, 20).map(c => `<tr><td class="mono">${c.day || stamp(c.ts)}</td><td class="num">${money((c.stats || {}).total || c.total)}</td>
            <td class="num">${c.cash != null ? money(c.cash) : '—'}</td>
            <td class="num" style="color:${c.diff > 0 ? 'var(--lime)' : c.diff < 0 ? 'var(--red)' : ''}">${c.diff != null ? money(c.diff) : '—'}</td>
            <td>${esc(c.byName || c.by || '—')}</td><td>${esc(c.note || '')}</td></tr>`).join('')}</tbody></table></div>`
      : '<p class="note">لا كشوف محفوظة. من الصندوق: التقارير ← 🔒 جرد وإغلاق اليوم.</p>'}</div>`;
  }

  /* ---------- 5) الموظفون ---------- */
  function viewStaff(v) {
    const s = P.state, staff = s.staff || [];
    v.innerHTML = `<div class="card" style="margin-bottom:12px"><div class="h">👥 حسابات النظام <span class="tag">${staff.length}</span>
      <span class="sp"></span><span class="note">الدخول الحالي: <b>${esc(P.user.name)}</b></span></div>
      <div class="scrl"><table class="tbl"><thead><tr><th>الموظف</th><th>اسم المستخدم</th><th>الصلاحيات</th><th>اللوحة</th><th>آخر دخول</th></tr></thead>
        <tbody>${staff.map(u => `<tr><td><b>${esc(u.name)}</b>${u.mustChange ? ' <span class="pill vip">يجب تغيير كلمته</span>' : ''}</td>
          <td><code style="direction:ltr">${esc(u.uname)}</code></td>
          <td>${(u.perms || []).includes('*') ? '<span class="pill vip">كل الصلاحيات</span>' : (u.perms || []).map(p => `<span class="pill p1">${esc(PERM[p] || p)}</span>`).join(' ')}</td>
          <td>${(u.perms || []).includes('*') || (u.perms || []).includes('watch') ? '<span class="pill ok">مصرّح</span>' : '<span class="pill no">لا</span>'}</td>
          <td class="num">${u.lastLogin ? stamp(Number(u.lastLogin)) : 'لم يدخل'}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card"><div class="h">📜 سجل العمليات (آخر 40)</div>${logList((s.log || []).slice(0, 40))}</div>`;
  }
  const PERM = {
    halls: 'الصالات', cafe: 'الكافتيريا', sales: 'عرض المبيعات', refund: 'المرتجعات', discount: 'الخصم',
    reports: 'التقارير', settings: 'الإعدادات', backup: 'النسخ', users: 'المستخدمون', watch: 'اللوحة'
  };

  /* ---------- 6) التحكم ---------- */
  function viewCtl(v) {
    const s = P.state || {}, acks = (s.acks || []).slice(-8).reverse();
    v.innerHTML = `<div class="danger-zone" style="margin-bottom:12px">
      <div class="h" style="font-size:16px">⛔ إيقاف النظام عن بُعد</div>
      <p class="note">يظهر فورًا على شاشة الصندوق غطاء «النظام موقوف» وتتعطل كل العمليات (بيع، إغلاق حساب، تمديد) — تبقى الجلسات المفتوحة محفوظة ويُسجَّل الإيقاف في سجل الصندوق.</p>
      <div class="fld" style="margin:12px 0"><label>سبب الإيقاف (يظهر للموظفين)</label>
        <input id="cnote" placeholder="مثال: انتهاء الدوام / التسوية المالية"></div>
      <div class="row">${canControl() ? `<button class="btn btn-d" data-ctl="pause">⛔ إيقاف النظام</button>
        <button class="btn btn-g" data-ctl="resume">▶ استئناف العمل</button>` : '<span class="pill no">🔒 حسابك للعرض فقط — لا يملك أمر الإيقاف</span>'}
        <span class="sp"></span>
        <span class="chip ${s.paused ? 'm' : 'g'}">حالة الصندوق: <b>${s.paused ? 'موقوف' : 'يعمل'}</b></span></div></div>
      <div class="grid g2">
        <div class="card"><div class="h">أوامر أخرى</div>
          <div class="row"><button class="btn btn-o" data-ctl="refresh">📡 بث فوري من الصندوق</button>
            <button class="btn btn-o" data-ctl="ping">🔔 رنّين تنبيه على الشاشة</button></div>
          <p class="note" style="margin-top:10px">لا تملك هذه اللوحة أي صلاحية تعديل بيانات: لا أسعار، ولا حذف فواتير، ولا تغيير جرد. فقط العرض + الأوامر أعلاه.</p></div>
        <div class="card"><div class="h">آخر الأوامر المنفّذة في الصندوق</div>
          <div class="scrl" style="max-height:24vh">${acks.length ? `<table class="tbl"><thead><tr><th>الوقت</th><th>الأمر</th><th>من</th></tr></thead>
            <tbody>${acks.map(a => `<tr><td class="num">${stamp(Number(a.ts))}</td><td>${esc(a.action)}</td><td>${esc(a.by || '—')}</td></tr>`).join('')}</tbody></table>`
        : '<p class="note">لم يُنفَّذ أي أمر بعد.</p>'}</div></div>
      </div>`;
  }
  async function control(act, note) {
    const txt = { pause: 'إيقاف النظام', resume: 'استئناف التشغيل', refresh: 'بث فوري', ping: 'تنبيه صوتي' }[act];
    if ((act === 'pause' || act === 'resume') && !canControl()) { toast('حسابك للعرض فقط — الإيقاف والاستئناف لحساب مدير اللوحة', 'err'); return; }
    if (!P.tx) { toast('لا يوجد اتصال: ' + (P.err || ''), 'err'); return; }
    if (act === 'pause' && !confirm('تأكيد إيقاف النظام؟ ستتعطل كل العمليات على شاشة الصندوق حتى يصل أمر الاستئناف.')) return;
    try {
      await P.tx.putCmd({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), action: act, by: P.user.name, note: note || $('#cnote') ? $('#cnote').value : '' });
      toast('✔ أُرسل الأمر: ' + txt, 'ok');
      setTimeout(() => fetchState(true), 2500);
    } catch (e) { toast('✖ فشل إرسال الأمر: ' + e.message, 'err'); }
  }

  /* ============ توليد قواعد الأمان من بيانات الصندوق نفسها ============ */
  const q = (arr, extra) => [...new Set([].concat(arr || [], extra || [])
    .map(x => String(x || '').trim().toLowerCase()).filter(x => x.indexOf('@') > 0))];
  function ruleEmails() {
    const st = P.state || {}, cl = st.cloud || {};
    const pos = String(cl.posEmail || (P.cfg.device || {}).email || '').toLowerCase();
    const admins = q(st.panelAdmins);
    const readers = q(st.panelEmails, admins.concat((st.watchers || []).map(u => u.femail), P.cfg.allow || []));
    return { pos, admins, readers };
  }
  const orList = (list, all) => {
    const l = [...new Set((list || []).filter(x => x && x.indexOf('@') > 0))];
    if (!l.length) return all ? 'auth != null' : 'false';
    return "auth != null && (" + l.map(e => "auth.token.email === '" + e + "'").join(' || ') + ")";
  };
  function rulesRTDB() {
    const r0 = ruleEmails();
    const admins = r0.admins.length ? r0.admins : r0.readers;
    /* بدون rules_version — شكل مقبول في محرر الكونسول لكل الإصدارات */
    const obj = {
      rules: {
        enterzone: {
          "$branch": {
            ".read": orList(r0.readers.concat([r0.pos])),
            state: { ".write": orList([r0.pos]) },
            cmd: { ".write": orList(admins), ".validate": "newData.hasChildren(['id'])" }
          }
        }
      }
    };
    return { text: JSON.stringify(obj, null, 2), emails: { pos: r0.pos, admins, readers: r0.readers }, guess: !r0.readers.length };
  }
  function rulesFS() {
    const r0 = ruleEmails();
    const admins = r0.admins.length ? r0.admins : r0.readers;
    const eq = e => "request.auth != null && request.auth.token.email == '" + e + "'";
    const any = l => (l && l.length) ? l.map(eq).join('\n          || ') : (admins.length ? 'false' : 'request.auth != null');
    return "rules_version = '2';\n" +
      "service cloud.firestore {\n" +
      "  match /databases/{database}/documents {\n\n" +
      "    // حساب الكاشير: هو الوحيد الذي يكتب حالة الصندوق\n" +
      "    function isPos() {\n      return " + (r0.pos ? eq(r0.pos) : 'false') + ";\n    }\n\n" +
      "    // حسابات اللوحة المسموح لها بالقراءة\n" +
      "    function canRead() {\n      return " + any([r0.pos].concat(r0.readers)) + ";\n    }\n\n" +
      "    // حسابات مسموح لها بإرسال أوامر الإيقاف/الاستئناف فقط\n" +
      "    function canCmd() {\n      return " + any(admins) + ";\n    }\n\n" +
      "    match /enterzone/{branch}/state {\n" +
      "      allow read: if canRead();\n" +
      "      allow write: if isPos();\n" +
      "    }\n\n" +
      "    match /enterzone/{branch}/cmd/{id} {\n" +
      "      allow read: if isPos() || canCmd();\n" +
      "      allow create, update: if canCmd();\n" +
      "      allow delete: if isPos();\n" +
      "    }\n\n" +
      "    // كل ما عدا ذلك ممنوع\n" +
      "    match /{document=**} {\n      allow read, write: if false;\n    }\n" +
      "  }\n}\n";
  }

  /* ============ ربط أوامر المراقبة فقط ============ */
  function bindView(e) {
    const t = e.target;
    const ctl = t.closest('[data-ctl]');
    if (ctl) { control(ctl.dataset.ctl, $('#cnote') ? $('#cnote').value : ''); return; }
    if (t.closest('#sync') || t.closest('#till')) control(t.closest('#sync') ? 'refresh' : 'ping');
  }

  /* ============ الإقلاع ============ */
  function start() {
    const cached = localStorage.getItem(CACHE);
    if (cached) { try { P.state = JSON.parse(cached); } catch (e) { } }
    if (!w.EZCloud) {
      $('#connTxt').textContent = 'تعذر تشغيل الاتصال';
      return;
    }
    applyCfg();
    P.user = { name: 'لوحة المراقبة', uname: 'monitor', role: 'panel', perms: ['*'], ctrl: true, via: 'direct', at: Date.now() };
    enter(false);
  }
  document.addEventListener('DOMContentLoaded', start);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) close();
  });
  addEventListener('online', () => { if (P.user) { applyCfg(); fetchState(false); } else boot(); });
  addEventListener('visibilitychange', () => { if (!document.hidden && P.user) fetchState(true); });
  $('#rf').onclick = () => fetchState(false);
    window.EZPANEL = { P, control, fetchState, canControl, signOut };
})(window);

</script>
